let currentQ = 0;
let scoreMap = {};
questionList.forEach(q=>{
  q.opts.forEach(opt=>{
    opt.tags.forEach(t=>scoreMap[t]=0)
  })
})

//页面切换
function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
  document.getElementById(id).classList.add("active")
}

//开始测试
function startTest(){
  currentQ=0;
  //清空分数
  Object.keys(scoreMap).forEach(k=>scoreMap[k]=0)
  renderQuestion()
  switchPage("page-test")
}

//渲染题目
function renderQuestion(){
  const qItem = questionList[currentQ];
  document.getElementById("progressNum").innerText = `第${currentQ+1}题 / 共10题`
  document.getElementById("questionText").innerText = qItem.q;
  const box = document.getElementById("optionBox");
  box.innerHTML = "";
  qItem.opts.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "option-item";
    div.innerText = opt.text;
    div.onclick=()=>{
      opt.tags.forEach(t=>scoreMap[t]++)
      currentQ++;
      if(currentQ>=questionList.length){
        calcResult()
      }else{
        renderQuestion()
      }
    }
    box.appendChild(div)
  })
}

//计算匹配角色
function calcResult(){
  //给每个角色算总分
  let maxScore = -1;
  let matchRoles = [];
  roleList.forEach(role=>{
    let s=0;
    role.tags.forEach(t=>s+=scoreMap[t]||0)
    role.totalScore = s;
    if(s>maxScore){
      maxScore=s;
      matchRoles=[role]
    }else if(s===maxScore){
      matchRoles.push(role)
    }
  })
  //同分随机选一个
  const finalRole = matchRoles[Math.floor(Math.random()*matchRoles.length)]
  fillResult(finalRole)
  switchPage("page-result")
}

//填充结果
function fillResult(role){
  document.getElementById("resName").innerText = role.name;
  document.getElementById("resBook").innerText = role.book;
  document.getElementById("resTag").innerText = role.tags.join("、");
  document.getElementById("resIntro").innerText = role.intro;
  document.getElementById("resQuote").innerText = role.quote;
  document.getElementById("resReason").innerText = `你的选择标签和${role.name}性格重合度最高，副本处事风格高度适配。`;
}

//重测
function restartTest(){
  switchPage("page-home")
}

//复制文本
function copyResult(){
  const name = document.getElementById("resName").innerText;
  const book = document.getElementById("resBook").innerText;
  const tag = document.getElementById("resTag").innerText;
  const intro = document.getElementById("resIntro").innerText;
  const quote = document.getElementById("resQuote").innerText;
  const text = `无限流凶宅测试结果
角色：${name}
原著：${book}
性格标签：${tag}
人设：${intro}
经典语录：${quote}`;
  navigator.clipboard.writeText(text).then(()=>alert("结果复制成功！"))
}
